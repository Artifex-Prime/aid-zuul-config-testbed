# The test bed's jobs with a secret (../README.md, "The test bed"; deploy/zuul/job-secrets.md). sync.sh puts them
# into the config project's copy, as testbed/secret-probe.yaml, with Artifex-Prime/aid-zuul-testbed replaced by the test bed's
# repository and the secret testbed-secret appended: a fixture, encrypted by deploy/zuul/encrypt-secret.sh for the
# test bed's own project key (project-key.pem in the copy), which run.sh gives Zuul before it starts. They are made as
# aid-zuul-config's zuul.d/release.yaml makes the release's: final, post-review, nodeless, the shared guard first.
#
# testbed-secret-probe may have the secret in post, and prints its SHA-256. testbed-secret-guard-probe may have it
# only in a pipeline named release, so in post the guard must fail it before its run playbook.

- job:
    name: testbed-secret-probe
    parent: base
    final: true
    post-review: true
    allowed-projects:
      - Artifex-Prime/aid-zuul-testbed
    nodeset: {nodes: []}
    attempts: 1
    timeout: 300
    pre-run: playbooks/secrets/guard.yaml
    run: playbooks/testbed/secret-probe.yaml
    secrets:
      - name: testbed_secret
        secret: testbed-secret
    vars:
      secret_pipelines: [post]
      secret_projects: [github.com/Artifex-Prime/aid-zuul-testbed]

- job:
    name: testbed-secret-guard-probe
    parent: base
    final: true
    post-review: true
    allowed-projects:
      - Artifex-Prime/aid-zuul-testbed
    nodeset: {nodes: []}
    attempts: 1
    timeout: 300
    pre-run: playbooks/secrets/guard.yaml
    run: playbooks/testbed/secret-probe.yaml
    secrets:
      - name: testbed_secret
        secret: testbed-secret
    vars:
      secret_pipelines: [release]
      secret_projects: [github.com/Artifex-Prime/aid-zuul-testbed]

# testbed-oidc-probe gets a token Zuul signs for its secret testbed-pusher, as aid-zuul-config's publishing jobs get
# aid-pusher's for the pusher (ci/zuul/publish.md, "The pusher"). It returns the token as the build's artifact, and the
# scenario checks its claims and its signature against Zuul's keys, as the pusher will. A test bed's token, for an
# audience nothing accepts, and gone in ten minutes.
- job:
    name: testbed-oidc-probe
    parent: base
    final: true
    post-review: true
    allowed-projects:
      - Artifex-Prime/aid-zuul-testbed
    nodeset: {nodes: []}
    attempts: 1
    timeout: 300
    pre-run: playbooks/secrets/guard.yaml
    run: playbooks/testbed/oidc-probe.yaml
    secrets:
      - name: testbed_pusher
        secret: testbed-pusher
    vars:
      secret_pipelines: [post]
      secret_projects: [github.com/Artifex-Prime/aid-zuul-testbed]

- secret:
    name: testbed-pusher
    oidc:
      ttl: 600
      # As aid-zuul-config's aid-pusher (#1637): an issuer other than [web] root, which the tenant allows.
      iss: http://web:9000
      claims:
        aud: thunderbox-registry

# testbed-secret: made by deploy/zuul/encrypt-secret.sh for Artifex-Prime/aid-zuul-config-testbed's key sha256 57a40f4a500ac882ef1ef4a777bed37343d96a1f1f2dd7314e15f95e7bfc6159.
- secret:
    name: testbed-secret
    data:
      value: !encrypted/pkcs1-oaep
        - 
