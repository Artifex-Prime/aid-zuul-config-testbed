# The test bed's jobs with a secret (../README.md, "The test bed"; deploy/zuul/job-secrets.md). sync.sh puts them
# into the config project's copy, as testbed/secret-probe.yaml, with Artifex-Prime/aid-zuul-testbed replaced by the test bed's
# repository and the secret testbed-secret appended: a fixture, encrypted by deploy/zuul/encrypt-secret.sh for the
# test bed's own project key (project-key.pem in the copy), which run.sh gives Zuul before it starts. They are made as
# aid-zuul-config's zuul.d/release.yaml makes the release's: final, post-review, nodeless, the shared guard first.
#
# testbed-secret-probe may have the secret in post, and prints its SHA-256. testbed-secret-guard-probe may have it
# only in a pipeline named release, so in post the guard must fail it before its run playbook.

- job:
    name: testbed-secret-probe
    parent: base
    final: true
    post-review: true
    allowed-projects:
      - Artifex-Prime/aid-zuul-testbed
    nodeset: {nodes: []}
    attempts: 1
    timeout: 300
    pre-run: playbooks/secrets/guard.yaml
    run: playbooks/testbed/secret-probe.yaml
    secrets:
      - name: testbed_secret
        secret: testbed-secret
    vars:
      secret_pipelines: [post]
      secret_projects: [github.com/Artifex-Prime/aid-zuul-testbed]

- job:
    name: testbed-secret-guard-probe
    parent: base
    final: true
    post-review: true
    allowed-projects:
      - Artifex-Prime/aid-zuul-testbed
    nodeset: {nodes: []}
    attempts: 1
    timeout: 300
    pre-run: playbooks/secrets/guard.yaml
    run: playbooks/testbed/secret-probe.yaml
    secrets:
      - name: testbed_secret
        secret: testbed-secret
    vars:
      secret_pipelines: [release]
      secret_projects: [github.com/Artifex-Prime/aid-zuul-testbed]

# testbed-secret: made by deploy/zuul/encrypt-secret.sh for Artifex-Prime/aid-zuul-config-testbed's key sha256 de4c62e2aca0f3aaecd0ac66e4325c893d410603aec283a117fc4137ddd7da37.
- secret:
    name: testbed-secret
    data:
      value: !encrypted/pkcs1-oaep
        - 
