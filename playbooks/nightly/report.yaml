# aid-nightly-report's run (zuul.d/publish.yaml), on the executor: report.py decides first, with no credential, whether
# this timer's nightly is reported here (04:00 in Madrid, and ci/publisher names Zuul). Only then is a token of the App
# aid-release made, with issues: write alone, for report.py to wait for aid-nightly's result and write it to the
# ci-nightly issue. The token is revoked whatever happens. The key and the token never reach a task whose output is
# read (AIDepartment#1542), as in playbooks/release/credentials.yaml.
- hosts: localhost
  gather_facts: false
  vars:
    nightly_args:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/report.py"
      - --publisher-file
      - "{{ zuul.executor.work_root }}/{{ zuul.project.src_dir }}/ci/publisher"
      - --zuul
      - "{{ nightly_zuul_api }}"
      - --tenant
      - "{{ zuul.tenant }}"
      - --buildset
      - "{{ zuul.buildset }}"
      - --build-url
      - "{{ zuul_web_root }}/t/{{ zuul.tenant }}/buildset/{{ zuul.buildset }}"
  tasks:
    - name: Whether this timer's nightly is reported here
      ansible.builtin.command:
        argv: "{{ nightly_args }}"
      register: nightly_decided
      changed_when: false
    - name: The decision
      ansible.builtin.debug:
        msg: "{{ nightly_decided.stdout | from_json }}"
    - name: The report, with a token for it alone
      when: (nightly_decided.stdout | from_json).report
      block:
        - name: A directory of its own for the App's key and token
          ansible.builtin.tempfile:
            state: directory
            suffix: -nightly
          register: nightly_dir
        - name: The App's key, readable by the job alone
          ansible.builtin.copy:
            content: "{{ aid_release_github.private_key }}"
            dest: "{{ nightly_dir.path }}/key.pem"
            mode: "0600"
          vars:
            ansible_remote_tmp: "{{ nightly_dir.path }}"
          no_log: true
        - name: A token of the App with issues write, made and checked
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../release/github-app-token.py"
              - --app-id
              - "{{ aid_release_github.app_id }}"
              - --repository
              - kristofk/AIDepartment
              - --permission
              - issues=write
              - --key-file
              - "{{ nightly_dir.path }}/key.pem"
              - --keep
              - "{{ nightly_dir.path }}/token"
          changed_when: false
        - name: The App's key removed
          ansible.builtin.file:
            path: "{{ nightly_dir.path }}/key.pem"
            state: absent
        - name: aid-nightly's result, to the ci-nightly issue
          ansible.builtin.command:
            argv: "{{ nightly_args + ['--token-file', nightly_dir.path ~ '/token'] }}"
          register: nightly_reported
          changed_when: false
        - name: What it did
          ansible.builtin.debug:
            msg: "{{ nightly_reported.stdout | from_json }}"
      always:
        - name: The App's token revoked
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../release/github-app-token.py"
              - --revoke
              - "{{ nightly_dir.path }}/token"
          changed_when: false
          failed_when: false
          when: nightly_dir.path is defined
        - name: Its directory removed
          ansible.builtin.file:
            path: "{{ nightly_dir.path }}"
            state: absent
          when: nightly_dir.path is defined
